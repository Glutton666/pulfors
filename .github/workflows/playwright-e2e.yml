name: Playwright 웹 E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: playwright-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Chromium 웹 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: npm 의존성 설치
        run: npm ci

      # Playwright 브라우저가 필요로 하는 Ubuntu 공유 라이브러리를 설치한다.
      - name: Playwright 시스템 의존성 설치
        run: npx playwright install-deps chromium

      - name: Playwright Chromium 설치
        run: npx playwright install chromium

      # playwright.config.ts의 webServer가 Expo 웹 앱을 포트 8081에서 기동한다.
      - name: 웹 E2E 테스트 실행
        run: |
          npx playwright test \
            e2e/score-note-preview-setting.spec.ts \
            e2e/modal-open-close.spec.ts \
            e2e/subdivision-type-picker.spec.ts
        env:
          CI: "true"
          EXPO_NO_DOCTOR: "1"

      - name: Playwright 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore